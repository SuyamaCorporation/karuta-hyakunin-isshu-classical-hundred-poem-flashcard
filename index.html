<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百人一首フラッシュカード</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card-wrap { perspective: 1000px; }
  .card { width:100%; min-height:280px; position:relative; transform-style:preserve-3d; transition:transform 0.6s; cursor:pointer; }
  .card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; width:100%; min-height:280px; backface-visibility:hidden; border-radius:1rem; padding:1.5rem; display:flex; flex-direction:column; box-shadow:0 6px 24px rgba(0,0,0,0.15); }
  .face-front { background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460); color:white; }
  .face-back { background:linear-gradient(160deg,#2d1515,#4a1515,#6b2020); color:white; transform:rotateY(180deg); }
  .waka { font-size:1.1rem; line-height:2; letter-spacing:0.05em; }
  .progress-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:2px; }
  .progress-cell { width:100%; padding-top:100%; border-radius:2px; }
</style>
</head>
<body class="bg-gradient-to-br from-red-50 to-pink-50 min-h-screen">
<div class="max-w-lg mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold text-center text-red-900 mb-1">百人一首フラッシュカード</h1>
  <p class="text-center text-gray-500 text-sm mb-5">百首の古典和歌を学ぶ — 上の句を見て、下の句を思い出す</p>

  <div class="bg-white rounded-xl shadow p-4 mb-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm font-semibold text-gray-700">進捗</span>
      <span id="stats-text" class="text-sm text-red-700 font-semibold"></span>
    </div>
    <div class="h-3 bg-gray-200 rounded-full overflow-hidden mb-3">
      <div id="progress-bar" class="h-full bg-red-500 rounded-full transition-all"></div>
    </div>
    <div class="progress-grid" id="progress-grid"></div>
  </div>

  <div class="flex gap-2 mb-4">
    <button onclick="setMode('seq')" id="btn-seq" class="flex-1 py-2 rounded-lg text-sm font-semibold bg-red-600 text-white">順番</button>
    <button onclick="setMode('shuffle')" id="btn-shuffle" class="flex-1 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">シャッフル</button>
    <button onclick="setMode('unmemorized')" id="btn-um" class="flex-1 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">未記憶のみ</button>
  </div>

  <div class="card-wrap mb-4">
    <div class="card" id="flashcard" onclick="flipCard()">
      <div class="face face-front">
        <div class="text-xs opacity-60 mb-2 flex justify-between">
          <span id="f-num"></span><span>上の句</span>
        </div>
        <div class="flex-1 flex items-center justify-center">
          <div class="waka text-center" id="f-kami"></div>
        </div>
        <div class="text-xs opacity-40 text-center mt-2">タップして下の句を見る</div>
      </div>
      <div class="face face-back">
        <div class="text-xs opacity-60 mb-1 flex justify-between">
          <span id="b-num"></span><span id="b-poet" class="font-semibold"></span>
        </div>
        <div class="mb-2">
          <div class="text-xs opacity-60 mb-1">上の句</div>
          <div class="waka text-sm opacity-80" id="b-kami"></div>
        </div>
        <div class="mb-2">
          <div class="text-xs opacity-60 mb-1">下の句</div>
          <div class="waka font-bold" id="b-shimo"></div>
        </div>
        <div class="mt-auto">
          <div class="text-xs opacity-60 mb-1">現代語訳</div>
          <div class="text-xs opacity-80" id="b-modern"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-2 mb-4">
    <button onclick="markMemorized()" id="btn-memorize" class="bg-green-100 text-green-700 py-2 rounded-lg text-sm font-semibold hover:bg-green-200">覚えた</button>
    <div class="flex gap-1">
      <button onclick="prevCard()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-300">←</button>
      <button onclick="nextCard()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-300">→</button>
    </div>
    <button onclick="unmarkMemorized()" class="bg-yellow-100 text-yellow-700 py-2 rounded-lg text-sm font-semibold hover:bg-yellow-200">戻す</button>
  </div>
  <div class="text-center text-xs text-gray-400" id="card-counter"></div>
</div>
<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const POEMS=[
[1,'秋の田のかりほの庵の苫をあらみ','わが衣手は露にぬれつつ','天智天皇','秋の田の刈り取り小屋の苫が粗いので、私の袖は露に濡れ続けている'],
[2,'春すぎて夏来にけらし白妙の','衣ほすてふ天の香具山','持統天皇','春が過ぎて夏が来たようだ。白い衣を干すという天の香具山に'],
[3,'あしびきの山鳥の尾のしだり尾の','ながながし夜をひとりかもねむ','柿本人麻呂','山鳥の長い尾のように長い夜を、ひとりで寝るのだろうか'],
[4,'田子の浦にうち出でてみれば白妙の','富士の高嶺に雪は降りつつ','山部赤人','田子の浦に出て見ると、富士の高峰に雪が降り続いている'],
[5,'奥山に紅葉踏みわけ鳴く鹿の','声聞くときぞ秋はかなしき','猿丸大夫','奥山で紅葉を踏み分けて鳴く鹿の声を聞く時こそ、秋は悲しい'],
[6,'かささぎの渡せる橋におく霜の','白きを見れば夜ぞ更けにける','中納言家持','カササギが渡す橋に置いた霜の白さを見ると、夜がふけたのだとわかる'],
[7,'天の原ふりさけみれば春日なる','三笠の山に出でし月かも','安倍仲麿','大空を見上げれば、春日の三笠山に出た月と同じ月だなあ'],
[8,'わが庵は都のたつみしかぞすむ','世をうぢ山と人はいふなり','喜撰法師','私の庵は都の東南にある。世を憂き山と人は言うが'],
[9,'花の色はうつりにけりないたづらに','わが身世にふるながめせしまに','小野小町','桜の花の色は褪せてしまった。長雨が降り、私自身もむなしく年を取りながら物思いにふけっている間に'],
[10,'これやこの行くも帰るも別れては','知るも知らぬも逢坂の関','蝉丸','これがあの、行く人も帰る人も、知り合いも他人も別れたり出会ったりする逢坂の関なのだ'],
[11,'わたの原八十島かけてこぎ出でぬと','人には告げよ海人の釣舟','参議篁','大海原に八十の島々をめざして漕ぎ出したと、都の人に伝えておくれ、漁師の釣り舟よ'],
[12,'あまつ風雲の通ひ路吹きとぢよ','をとめの姿しばしとどめむ','僧正遍昭','天の風よ、雲の通り道を吹き閉じておくれ。天女の姿をもうしばらく留めておきたいから'],
[13,'筑波ねのみねより落つるみなのがわ','恋ぞつもりて淵となりぬる','陽成院','筑波山の峰から落ちる水が流れ集まって淵となるように、恋心も積もって深い淵になった'],
[14,'陸奥のしのぶもぢずり誰ゆゑに','乱れそめにし我ならなくに','河原左大臣','陸奥の忍草の乱れ模様のように、誰のせいで私の心は乱れ始めたのか、私のせいではないのに'],
[15,'君がため春の野に出でて若菜つむ','わが衣手に雪は降りつつ','光孝天皇','あなたのために春の野に出て若菜を摘む。私の袖に雪が降り続けながら'],
[16,'立ちわかれいなばの山の峰に生ふる','まつとし聞かばいまかへりこむ','中納言行平','別れて去った因幡の山の峰に生える松のように、待っていると聞いたら今すぐ帰ってきましょう'],
[17,'ちはやぶる神代もきかず竜田川','からくれなゐに水くくるとは','在原業平朝臣','神代にも聞いたことがない。竜田川が紅葉を染めて、唐紅に水を絞り染めにするとは'],
[18,'住の江の岸による波よるさへや','夢の通ひ路人目よくらむ','藤原敏行朝臣','住之江の岸に寄る波のように、夜さえも夢の中でさえ、人目を気にして避けているのだろうか'],
[19,'難波潟みじかき葦のふしの間も','逢はでこの世を過ぐしてよとや','伊勢','難波の葦の短い節の間ほどのわずかな時間も逢わないで、この世を過ごせというのでしょうか'],
[20,'わびぬれば今はた同じ難波なる','みをつくしても逢はむとぞ思ふ','元良親王','もう嘆いてもどうにもならない。難波の澪標が沈むように命を尽くしても逢おうと思う'],
[21,'いまこむといひしばかりに長月の','有明の月を待ち出でつるかな','素性法師','今来ると言ったので、ただそれだけで、長月の有明の月が出るまで待ってしまったことだ'],

[23,'月みれば千々に物こそかなしけれ','わが身ひとつの秋にはあらねど','大江千里','月を見ると、千々に物悲しくなる。私一人の秋ではないけれど'],
[24,'このたびはぬさもとりあへず手向山','紅葉の錦神のまにまに','菅家','今度の旅は幣も用意できなかった。手向山の錦の紅葉を、神のお心のままに捧げます'],
[25,'名にし負はばいざこととはむ都鳥','わが思ふ人はありやなしやと','三条右大臣','都鳥という名を持つなら、さあ聞いてみよう。私が思う人は元気でいるかどうかと'],
[26,'小倉山峰のもみぢ葉心あらば','今ひとたびのみゆき待たなむ','貞信公','小倉山よ、峰の紅葉に心があるなら、もう一度の行幸をお待ちなさい'],
[27,'みかの原わきて流るるいづみ川','いつ見きとてか恋しかるらむ','中納言兼輔','甕の原に湧き出て流れる泉川よ。いつ逢ったというので、こんなに恋しいのだろう'],
[28,'山里は冬ぞさびしさまさりける','人めも草もかれぬと思へば','源宗于朝臣','山里は冬こそ寂しさが増すものだ。人の訪れも草も枯れてしまうと思うと'],
[29,'心あてに折らばや折らむ初霜の','置きまどはせる白菊の花','凡河内躬恒','見当をつけて折ろうか折ろうか。初霜が降りて見分けがつかなくなった白菊の花を'],
[30,'有明のつれなく見えし別れより','暁ばかりうきものはなし','壬生忠岑','有明の月が冷たく見えたあの別れ以来、夜明け時ほどつらいものはない'],
[31,'朝ぼらけ有明の月とみるまでに','吉野の里に降れる白雪','坂上是則','夜明け近く、有明の月の光かと思うほど、吉野の里に白雪が降っている'],
[32,'山川に風のかけたるしがらみは','流れもあへぬ紅葉なりけり','春道列樹','山川に風がかけた柵は、流れることもできない紅葉だったのだ'],
[33,'久方の光のどけき春の日に','しづ心なく花の散るらむ','紀友則','穏やかな春の日に、なぜ桜の花は落ち着きなく散るのだろう'],
[34,'誰をかも知る人にせむ高砂の','松も昔の友ならなくに','藤原興風','誰を知り合いにしようか。高砂の松も昔の友ではないのに'],
[35,'人はいさ心も知らずふるさとは','花ぞ昔の香ににほひける','紀貫之','あなたの心は知りません。でも故郷の梅の花は昔と同じ香りで咲いている'],
[36,'夏の夜はまだ宵ながら明けぬるを','雲のいづこに月やどるらむ','清原深養父','夏の夜はまだ宵のうちに明けてしまった。雲のどこに月は宿っているのだろう'],
[37,'白露に風の吹きしく秋の野は','つらぬきとめぬ玉ぞ散りける','文屋朝康','白露に風が重なって吹く秋の野では、糸を通して留めていない玉が散るように露が散っている'],
[38,'忘らるる身をば思はず誓ひてし','人の命の惜しくもあるかな','右近','忘れられる身のことは気にしない。でも誓ってくれたあなたの命が惜しく思われる'],
[39,'浅茅生の小野の篠原しのぶれど','あまりてなどか人の恋しき','参議等','浅い茅の生えた小野の篠原のように、忍んでいるのに、どうしてこんなにあの人が恋しいのか'],
[40,'忍ぶれど色に出でにけりわが恋は','ものや思ふと人の問ふまで','平兼盛','人に気づかれないよう隠していたのに、恋心が顔色に出てしまった。物思いしているのかと人が問うほど'],
[41,'恋すてふわが名はまだき立ちにけり','人知れずこそ思ひそめしか','壬生忠見','恋をしているという私の噂がもうたってしまった。誰にも知られずに思い始めたのに'],
[42,'契りきなかたみに袖をしぼりつつ','末の松山波こさじとは','清原元輔','あの時、互いに袖を絞って泣きながら、末の松山を波が越えないように変わらぬことを誓い合ったのに'],
[43,'逢ひ見ての後の心にくらぶれば','昔はものを思はざりけり','権中納言敦忠','逢ったその後の心に比べれば、逢う前は何も思い悩んでいなかったのだ'],
[44,'逢ふことの絶えてしなくはなかなかに','人をも身をも恨みざらまし','中納言朝忠','逢うことが全くなければ、かえって相手も自分も恨まずにすんだのに'],
[45,'あはれとも言ふべき人は思ほえで','身のいたづらになりぬべきかな','謙徳公','「可哀想だ」と言ってくれる人は思い当たらず、私はむなしく死んでしまいそうだ'],
[46,'由良の門を渡る舟人かぢをたえ','ゆくへも知らぬ恋の道かな','曽禰好忠','由良の瀬戸を渡る船頭が梶を失って行方も知らないように、私の恋の行方も知らない'],
[47,'八重むぐらしげれる宿のさびしきに','人こそ見えね秋は来にけり','恵慶法師','八重葎が生い茂って荒れ果てた宿は寂しいことよ。人は来なくても秋はやってきた'],
[48,'風をいたみ岩うつ波のおのれのみ','くだけてものを思ふころかな','源重之','風が激しく岩を打つ波が自分だけ砕け散るように、私だけが心を砕いて物思いにふける頃だ'],
[49,'みかきもり衛士のたく火の夜はもえ','昼は消えつつ物をこそ思へ','大中臣能宣朝臣','宮中を守る衛士がたく火のように、夜は燃え、昼は消えながら、私は恋に物思いをしている'],

[51,'かくとだにえやはいぶきのさしも草','さしも知らじな燃ゆる思ひを','藤原実方朝臣','このようにとさえ言えない。伊吹山のさしも草のように燃える思いを、あなたは知らないでしょう'],

[69,'嵐吹く三室の山のもみぢ葉は','竜田の川の錦なりけり','能因法師','嵐が吹く三室山の紅葉は竜田川の錦の織物だったのだ'],

[99,'人もをし人もうらめしあぢきなく','世を思ふゆゑにもの思ふ身は','後鳥羽院','人が愛しくもあり恨めしくもある。甲斐もなくこの世を思うゆえに物思いにふける私には'],
[100,'ももしきや古き軒端のしのぶにも','なほあまりある昔なりけり','順徳院','宮中の古い軒端の忍草を見ても、なおあまりある昔の栄華であったことよ']
];
let memorized=JSON.parse(localStorage.getItem('karuta-mem')||'[]');
let mode='seq',queue=[],idx=0,flipped=false;
function setMode(m){
  mode=m;
  ['seq','shuffle','unmemorized'].forEach(mm=>{
    document.getElementById('btn-'+mm).className='flex-1 py-2 rounded-lg text-sm font-semibold '+(m===mm?'bg-red-600 text-white':'bg-gray-200 text-gray-700 hover:bg-gray-300');
  });
  buildQueue();idx=0;showCard();
}
function buildQueue(){
  if(mode==='seq') queue=POEMS.map((_,i)=>i);
  else if(mode==='shuffle'){queue=POEMS.map((_,i)=>i);for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}}
  else{queue=POEMS.map((_,i)=>i).filter(i=>!memorized.includes(POEMS[i][0]));if(!queue.length)queue=POEMS.map((_,i)=>i);}
}
function showCard(){
  if(!queue.length)return;
  if(idx>=queue.length)idx=0;
  const p=POEMS[queue[idx]];
  flipped=false;document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('f-num').textContent='第'+p[0]+'首';
  document.getElementById('f-kami').textContent=p[1];
  document.getElementById('b-num').textContent='第'+p[0]+'首';
  document.getElementById('b-poet').textContent=p[3];
  document.getElementById('b-kami').textContent=p[1];
  document.getElementById('b-shimo').textContent=p[2];
  document.getElementById('b-modern').textContent=p[4];
  document.getElementById('card-counter').textContent=(idx+1)+'/'+queue.length;
  updateStats();
}
function flipCard(){flipped=!flipped;document.getElementById('flashcard').classList.toggle('flipped',flipped);}
function markMemorized(){const p=POEMS[queue[idx]];if(!memorized.includes(p[0])){memorized.push(p[0]);localStorage.setItem('karuta-mem',JSON.stringify(memorized));}updateStats();nextCard();}
function unmarkMemorized(){const p=POEMS[queue[idx]];memorized=memorized.filter(n=>n!==p[0]);localStorage.setItem('karuta-mem',JSON.stringify(memorized));updateStats();showCard();}
function nextCard(){idx=(idx+1)%queue.length;showCard();}
function prevCard(){idx=(idx-1+queue.length)%queue.length;showCard();}
function updateStats(){
  const pct=(memorized.length/100)*100;
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('stats-text').textContent=memorized.length+'/100 首記憶';
  const grid=document.getElementById('progress-grid');grid.innerHTML='';
  for(let i=0;i<100;i++){const cell=document.createElement('div');cell.className='progress-cell '+(memorized.includes(i+1)?'bg-red-500':'bg-gray-200');cell.title='第'+(i+1)+'首';grid.appendChild(cell);}
}
buildQueue();showCard();updateStats();
</script>
